<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Abdullah Baleid</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .notfound { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; }
        .notfound .container { display: grid; justify-items: center; gap: 20px; }
        .notfound__code { font-family: var(--font-serif); font-style: italic; font-size: clamp(5rem, 3rem + 10vw, 10rem); line-height: 1; color: var(--accent); }
    </style>
</head>
<body>
    <main class="notfound">
        <div class="container">
            <p class="notfound__code">404</p>
            <h1 class="section-title">This page doesn’t <em>exist</em>.</h1>
            <p style="color: var(--ink-2); max-width: 32rem;">The link may be old. Everything now lives on a single page.</p>
            <a class="btn btn--accent" href="/">Back to the portfolio</a>
        </div>
    </main>
</body>
</html>
